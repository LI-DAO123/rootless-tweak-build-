name: Build Tweak (Free & No Queue)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 允许你手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest # 关键：使用 Linux 运行器，永远不排队

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos (Linux Environment)
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Build Tweak Package
        run: make package

      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTweak-Deb-Package
          path: packages/*.deb
