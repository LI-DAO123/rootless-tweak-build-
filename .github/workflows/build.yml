name: Build Tweak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Theos for RootHide
        run: |
          # 1. 克隆 roothide 分支的 Theos
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          export THEOS=$HOME/theos
          
          # 2. 安装 ldid 签名工具 (关键修复点)
          brew install ldid
          
          # 3. 下载 iOS SDK
          mkdir -p $THEOS/sdks
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o sdk.tar.xz
          tar -xf sdk.tar.xz -C $THEOS/sdks
          
          # 4. 配置环境变量
          echo "$THEOS/bin" >> $GITHUB_PATH
          
      - name: Build Package
        run: |
          export THEOS=$HOME/theos
          make clean
          make package
          
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: Tweak-Package
          path: packages/*.deb
