name: Build Rootless Tweak
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl unzip perl build-essential

      - name: Download Theos
        run: |
          rm -rf $HOME/theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install latest SDK
        run: |
          $THEOS/bin/install-sdk latest

      - name: Build package
        run: |
          make clean package THEOS_PACKAGE_SCHEME=rootless

      - name: Export deb
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstTweak-deb
          path: packages/*.deb
