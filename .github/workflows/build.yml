name: Build Tweak
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip -d /tmp/sdktmp
          mv /tmp/sdktmp/sdks-master/*.sdk $HOME/theos/sdks/
          rm -rf master.zip /tmp/sdktmp

      - name: Build deb package
        run: |
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Tweak-Deb
          path: ./packages/*.deb
