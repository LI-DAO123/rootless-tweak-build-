name: Build Tweak
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          sudo apt update
          sudo apt install -y curl build-essential ldid

      - name: Build & Package
        run: |
          make clean
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-package
          path: packages/*.deb
