name: Build Tweak
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build rootless tweak
        uses: hbang/build-theos-tweak@main
        with:
          scheme: rootless
          archs: arm64,arm64e

      - name: Upload built deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-package
          path: packages/*.deb
